name: Build Market Finder Pro (Windows EXE)

on:
  push:
    branches: [ "claude/jolly-ramanujan-knkbm0", main ]
    paths:
      - "market-finder-app/**"
      - ".github/workflows/build-market-finder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained EXE
        run: |
          dotnet publish market-finder-app/MarketFinderPro.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./dist-market-finder

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketFinderPro-win-x64
          path: dist-market-finder/MarketFinderPro.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-market-finder/MarketFinderPro.exe

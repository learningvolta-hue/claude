name: Build Windows EXE

on:
  push:
    branches: [ "claude/create-windows-software-Do9VF", main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained EXE
        run: |
          dotnet publish screenshot-app/ScreenshotApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotApp-win-x64
          path: dist/ScreenshotApp.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ScreenshotApp.exe

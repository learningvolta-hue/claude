name: Build Analisi Immobiliare

on:
  push:
    branches: [ "claude/nice-archimedes-p5rrwo", main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test del motore di calcolo
        run: dotnet test tests/AnalisiImmobiliare.Tests -c Release

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Crea l'eseguibile unico per Windows
        run: |
          dotnet publish src/AnalisiImmobiliare.App/AnalisiImmobiliare.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o ./dist
          Copy-Item esempi/*.immo ./dist/

      - name: Carica l'eseguibile
        uses: actions/upload-artifact@v4
        with:
          name: AnalisiImmobiliare-win-x64
          path: dist/

      - name: Pubblica la release (solo sui tag v*)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AnalisiImmobiliare.exe
            dist/*.immo
